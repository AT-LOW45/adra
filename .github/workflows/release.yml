name: Release

# Driven by GitHub Releases rather than tag pushes, so publishing is a deliberate act:
# drafting a release is reviewable and reversible right up until it is published.
on:
  release:
    types: [published]
  # Lets the image be rebuilt without cutting a new release (e.g. a base-image CVE).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Backend image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushing to GHCR; GITHUB_TOKEN is enough, no extra secret
    steps:
      - uses: actions/checkout@v7

      # The runner is Intel; QEMU is what lets it emit arm64 layers too.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io wants a lowercase path; the owner here is mixed case.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # :1.2.3 and :1.2 come from the tag, so they only appear when the run is on a
          # tag ref -- a published release, or a manual rebuild with a tag selected.
          # A manual run from a branch gets the branch name instead, which keeps the
          # push valid: with no rule matching, buildx fails with "tag is needed".
          # "latest" is reserved for a real release, never a rebuild of an older ref.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Without this, buildx builds only for the runner's own architecture, so the
          # image was Intel-only and unpullable on Apple Silicon or ARM servers.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
