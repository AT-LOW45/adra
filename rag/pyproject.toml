[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.24",
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "fastapi>=0.136.3",
    "langchain>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.6",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.29",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "uvicorn>=0.48.0",
]

[tool.uv]
package = false

# sentence-transformers pulls in PyTorch, and PyTorch's default Linux wheel bundles the
# CUDA stack -- around 4 GB of NVIDIA libraries that this CPU-only service never touches
# but that ship in every image pull. Redirect it to PyTorch's CPU index on Linux.
#
# torch is declared as a direct dependency above purely so this applies: uv sources only
# bind a project's own dependencies, not transitive ones. The marker keeps macOS on PyPI,
# where the wheels carry no CUDA anyway -- so local development is unaffected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pyright]
pythonVersion = "3.13"
